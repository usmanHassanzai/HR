<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/scorr-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Phase 3: PWA + native app metadata -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scorr" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.webp" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.webp" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.webp" />

    <!-- Hero headline face only (Outfit 800) — self-hosted, font-display: swap via @font-face -->
    <link
      rel="preload"
      href="/fonts/outfit-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Scorr — KPI scoreboard, GPS attendance &amp; MFA | scorr.walfia.ai</title>
    <meta
      name="description"
      content="Scorr aligns KPI weightage and score, GPS attendance, overnight shifts, and rewards — with authenticator MFA, backup codes, and email recovery for every privileged login."
    />
    <link rel="canonical" href="https://scorr.walfia.ai/" />

    <!-- Theme before any paint — avoids flash with prerendered HTML (CSS uses [data-theme]). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('scorr-theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = pref === 'light' || pref === 'dark' ? pref : (dark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (pref === 'light' || pref === 'dark' || pref === 'system') {
            document.documentElement.setAttribute('data-theme-pref', pref);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f7fb' : '#0b1120');

          // iOS + app shell before first paint — keeps header below the status bar.
          var ua = navigator.userAgent || '';
          var ios = /iPad|iPhone|iPod/i.test(ua)
            || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
          if (ios) {
            document.documentElement.classList.add('ios-device');
          }
          var q = new URLSearchParams(window.location.search);
          var standalone = window.matchMedia('(display-mode: standalone)').matches
            || (window.navigator).standalone === true;
          if (standalone || q.get('app') === '1' || q.get('mode') === 'app') {
            document.documentElement.classList.add('app-shell');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
