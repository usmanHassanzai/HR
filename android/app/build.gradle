apply plugin: 'com.android.application'

def keystoreEnvFile = new File(System.getProperty('user.home'), '.scorr/keystore.env')
def keystoreProps = new Properties()
if (keystoreEnvFile.exists()) {
    keystoreEnvFile.withInputStream { keystoreProps.load(it) }
}
// Prefer env vars (CI / release scripts), then ~/.scorr/keystore.env (never commit).
def releaseStoreFile = System.getenv('SCORR_ANDROID_KEYSTORE') ?: keystoreProps.getProperty('SCORR_ANDROID_KEYSTORE')
def releaseStorePassword = System.getenv('SCORR_ANDROID_STORE_PASSWORD') ?: keystoreProps.getProperty('SCORR_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SCORR_ANDROID_KEY_ALIAS') ?: keystoreProps.getProperty('SCORR_ANDROID_KEY_ALIAS') ?: 'scorr'
def releaseKeyPassword = System.getenv('SCORR_ANDROID_KEY_PASSWORD') ?: keystoreProps.getProperty('SCORR_ANDROID_KEY_PASSWORD')
def hasReleaseKey = releaseStoreFile && releaseStorePassword && releaseKeyPassword && file(releaseStoreFile).exists()

android {
    namespace = "ai.walfia.scorr"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.walfia.scorr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "1.3.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Prefer the permanent release key even for local install-over-update testing
            // so users never need to uninstall when graduating to Play / website APKs.
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.security:security-crypto:1.0.0"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
