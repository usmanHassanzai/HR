appId: ai.walfia.scorr.desktop
productName: Scorr
copyright: Copyright © Walfia
electronVersion: 37.10.3
npmRebuild: false
nodeGypRebuild: false
directories:
  output: ../dist-desktop
  buildResources: .
files:
  - main.cjs
  - preload.cjs
  - icon.png
  - package.json
  - node_modules/**/*
asar: true
publish:
  - provider: generic
    url: https://scorr.walfia.ai/downloads/desktop/
    useMultipleRangeRequest: false
linux:
  target:
    - deb
    - AppImage
  category: Office
  icon: icon.png
  maintainer: Walfia <hello@walfia.ai>
  artifactName: Scorr-${version}.${ext}
win:
  # Proper installer (Start Menu + Desktop shortcut). Skip Wine signing on Linux CI.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  icon: icon.png
  artifactName: Scorr-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Scorr
  createDesktopShortcut: always
  createStartMenuShortcut: true
  uninstallDisplayName: Scorr
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # Keep appData so login / attendance tokens survive updates
mac:
  target:
    - dmg
  category: public.app-category.business
  icon: icon.png
  artifactName: Scorr-${version}.${ext}
