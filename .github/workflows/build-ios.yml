name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'scripts/build-ios-ipa.mjs'
      - 'scripts/sync-ios-icons.mjs'

jobs:
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync iOS project
        run: node scripts/build-ios-ipa.mjs

      - name: Build for iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            build

      - name: Upload simulator build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/App/build/
          if-no-files-found: ignore

  # Produce IPA when Apple signing secrets are present (Ad Hoc / App Store).
  # Secrets: APPLE_TEAM_ID, BUILD_CERTIFICATE_BASE64, P12_PASSWORD, PROVISION_PROFILE_BASE64
  ios-ipa:
    runs-on: macos-latest
    if: ${{ vars.IOS_IPA_BUILD == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Install provisioning profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Patch ExportOptions team ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ios/ExportOptions.plist || true
          /usr/libexec/PlistBuddy -c "Set :method ad-hoc" ios/ExportOptions.plist || true
      - run: node scripts/build-ios-ipa.mjs --archive
      - uses: actions/upload-artifact@v4
        with:
          name: scorr-ipa
          path: |
            public/downloads/scorr.ipa
            public/downloads/ios/manifest.plist
          if-no-files-found: error
